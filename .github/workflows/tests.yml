name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:v17.3.0
        ports:
          - 3001:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Wait for Juice Shop
        run: timeout 120 bash -c 'until curl -s localhost:3001 > /dev/null; do sleep 2; done'
      - run: pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            allure-results
            test-results
