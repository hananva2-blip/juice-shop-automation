name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"  # every night at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:v17.3.0
        ports:
          - 3001:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: playwright install --with-deps chromium firefox
      - name: Wait for Juice Shop
        run: timeout 120 bash -c 'until curl -s localhost:3001 > /dev/null; do sleep 2; done'
      - run: pytest --browser chromium --browser firefox
      - name: Build Allure report
        if: always()
        run: npx --yes allure-commandline generate allure-results -o allure-report
      - uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: allure-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
